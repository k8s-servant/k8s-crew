# View-only identity for the k8s-crew session. Nothing here can write, and nothing
# here can read Secrets: the built-in `view` role leaves them out, and the extra
# role below never names them.
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-crew
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crew-viewer
  namespace: k8s-crew
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crew-viewer-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: crew-viewer
    namespace: k8s-crew
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crew-viewer-extra
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - persistentvolumes
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources:
      - storageclasses
      - csidrivers
      - csinodes
      - volumeattachments
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs: [get, list, watch]
  # cert-manager's own view role leaves ClusterIssuers out.
  - apiGroups: [cert-manager.io]
    resources:
      - clusterissuers
    verbs: [get, list, watch]
  # Argo CD aggregates nothing to `view`.
  - apiGroups: [argoproj.io]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: [get, list, watch]
  # Nor does Gatekeeper; its constraint kinds are generated, so take the whole group.
  - apiGroups: [templates.gatekeeper.sh]
    resources:
      - constrainttemplates
    verbs: [get, list, watch]
  - apiGroups: [constraints.gatekeeper.sh, config.gatekeeper.sh, mutations.gatekeeper.sh,
                syncset.gatekeeper.sh, status.gatekeeper.sh, expansion.gatekeeper.sh]
    resources: ["*"]
    verbs: [get, list, watch]
  # The Prometheus Operator aggregates nothing to `view`.
  - apiGroups: [monitoring.coreos.com]
    resources: ["*"]
    verbs: [get, list, watch]
  # Cilium aggregates nothing to `view` either.
  - apiGroups: [cilium.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # Nor does Istio. Its own reader role also grants credentials, so it is not used.
  - apiGroups: [networking.istio.io, security.istio.io, telemetry.istio.io,
                extensions.istio.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # The Gateway API and Envoy Gateway ship no read role at all.
  - apiGroups: [gateway.networking.k8s.io, gateway.envoyproxy.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # Velero and CloudNativePG aggregate nothing to `view`. Not DownloadRequests: their
  # status holds a signed URL to a backup's files.
  - apiGroups: [velero.io]
    resources:
      - backups
      - restores
      - schedules
      - backupstoragelocations
      - volumesnapshotlocations
      - podvolumebackups
      - podvolumerestores
      - datauploads
      - datadownloads
      - backuprepositories
      - deletebackuprequests
      - serverstatusrequests
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # `view` leaves the RBAC objects out.
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: [get, list, watch]
  # APIServices show whether metrics-server or KEDA serve the metrics APIs.
  - apiGroups: [apiregistration.k8s.io]
    resources:
      - apiservices
    verbs: [get, list, watch]
  # CRDs (which versions are served) and API Priority and Fairness.
  - apiGroups: [apiextensions.k8s.io]
    resources:
      - customresourcedefinitions
    verbs: [get, list, watch]
  - apiGroups: [flowcontrol.apiserver.k8s.io]
    resources:
      - flowschemas
      - prioritylevelconfigurations
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crew-viewer-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crew-viewer-extra
subjects:
  - kind: ServiceAccount
    name: crew-viewer
    namespace: k8s-crew
